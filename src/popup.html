<!doctype html>
<!-- GameBoy Plugin by Tonkatsudon. MIT License, see LICENSE. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Must match the iframe's color-scheme in overlay.js to stay transparent on dark pages. -->
  <meta name="color-scheme" content="light">
  <title>GameBoy Plugin by Tonkatsudon</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="gameboy" id="gameboy">
    <img class="skin" id="skin" alt="" draggable="false">

    <div class="screen">
      <img class="boot" id="boot" alt="" hidden>
      <!-- The real game: a sandboxed EmulatorJS page (emulator.html). It never
           takes clicks or focus; popup.js forwards the shell's buttons to it. -->
      <iframe id="emu" title="Game" tabindex="-1" allow="autoplay *; gamepad *"></iframe>
      <!-- What the boot ROM shows with no cartridge in: the logo reads back as
           a black bar. Drawn by popup.js; clicking it loads a ROM. -->
      <button class="no-game" id="no-game" title="Load a .gb / .gbc ROM" hidden>
        <canvas id="no-game-art" width="498" height="280"></canvas>
        <small>Click to load a ROM</small>
      </button>
      <input type="file" id="rom-input" accept=".gb,.gbc" hidden>
      <div class="web" id="web" hidden>
        <form class="urlbar" id="urlbar">
          <button type="button" id="web-back" title="Back (B)" aria-label="Back" disabled>&lsaquo;</button>
          <input id="url" type="text" placeholder="Search or type a URL" spellcheck="false" autocomplete="off">
        </form>
        <div class="web-page">
          <!-- No allow-top-navigation: framed sites can't navigate the page hosting the Game Boy. -->
          <iframe id="page" title="Web page"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        </div>
      </div>
    </div>

    <div class="dpad">
      <button data-key="up" class="up" aria-label="Up"></button>
      <button data-key="left" class="left" aria-label="Left"></button>
      <button data-key="right" class="right" aria-label="Right"></button>
      <button data-key="down" class="down" aria-label="Down"></button>
    </div>
    <button data-key="b" class="round b" aria-label="B"></button>
    <button data-key="a" class="round a" aria-label="A"></button>
    <button data-key="select" class="pill select" aria-label="Select"></button>
    <button data-key="start" class="pill start" aria-label="Start"></button>

    <!-- Revealed when hovering the bottom edge of the shell. -->
    <div class="tray">
      <div class="toolbar">
        <div class="toolbar-row">
          <div class="skins" id="skins"></div>
          <button class="boot-mode" id="saves-open" title="Export, import or delete save files">Saves</button>
          <button class="boot-mode" id="fullscreen" title="Full screen (F11)">Full</button>
          <button class="close" id="close" title="Close" aria-label="Close">&times;</button>
        </div>
        <div class="toolbar-row">
          <select class="game-pick" id="game-pick" title="Pick a game" aria-label="Game"></select>
          <button class="boot-mode" id="boot-mode" title="Switch boot animation"></button>
          <button class="boot-mode" id="mode"></button>
        </div>
      </div>
    </div>

    <div class="saves" id="saves" role="dialog" aria-labelledby="saves-title" hidden>
      <div class="saves-card">
        <div class="saves-head">
          <h2 id="saves-title">Save files</h2>
          <button class="close" id="saves-close" title="Close" aria-label="Close">&times;</button>
        </div>
        <ul class="saves-list" id="saves-list"></ul>
        <p class="saves-note">Importing or deleting a save restarts that game from its title screen.</p>
      </div>
      <input type="file" id="save-input" accept=".sav,.srm" hidden>
    </div>
  </div>

  <!-- Sits in the transparent corner the shell's curve leaves free. -->
  <div class="grip" id="grip" title="Drag to resize"></div>

  <script src="web-storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
